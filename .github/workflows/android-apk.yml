name: Build Android APK
on:
  push:
    branches: [build/android-apk]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: sed -i /proxyHost/d android/gradle.properties; sed -i /proxyPort/d android/gradle.properties
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: macaron-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish APK to GitHub Pages
        run: |
          mkdir -p pages/android-download
          cp build/app/outputs/flutter-apk/app-release.apk pages/android-download/macaron.apk
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-download/macaron.apk
          git commit -m "Publish Android APK for ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
