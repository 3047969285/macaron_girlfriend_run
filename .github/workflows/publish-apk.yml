name: Publish Android test APK
on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-apk.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: macaron-android-apk
          path: android-download
          run-id: 41799153944
          github-token: ${{ github.token }}
      - run: |
          mv android-download/app-release.apk android-download/macaron.apk
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add android-download/macaron.apk
          git commit -m 'Publish ARM64 Android APK for 1403066'
          git push origin HEAD:gh-pages
