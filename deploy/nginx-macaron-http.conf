# 马卡龙 Web 版：纯 HTTP（IP 直连）服务器配置
# 适用：http://47.104.137.7/，站点目录为 /var/www/macaron/current（软链到 releases/<版本>）。
# 安装：
#   cp deploy/nginx-macaron-http.conf /etc/nginx/conf.d/macaron.conf
#   nginx -t && nginx -s reload
#
# 优化点：
# 1. gzip_static：直接发送构建时生成的 .gz（main.dart.js 2.8MB -> 0.8MB，
#    canvaskit.wasm 7.2MB -> 2.9MB）；gzip_types 补上 text/javascript，
#    否则新版 nginx 的 .js 类型匹配不到，动态 gzip 也不会生效。
# 2. 入口文件不缓存，assets 用短缓存，避免更新后浏览器长期拿着旧图。
# 3. sendfile / open_file_cache / keepalive 降低静态文件 IO 开销。
# 注意：纯 HTTP 下浏览器不启用 Service Worker，离线缓存不可用；
# 想要离线包和更强的缓存控制，请配 HTTPS（见 nginx-macaron.conf）。

server {
    listen 80;
    server_name 47.104.137.7;

    root /var/www/macaron/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;
    gzip_static on;
    # nginx 编了 brotli 模块时可以再开：
    # brotli_static on;

    # 入口和版本文件：每次都向服务器确认，保证新构建立即生效。
    location = /.last_build_id {
        default_type text/plain;
        add_header Cache-Control no-store;
    }
    location = /index.html {
        add_header Cache-Control no-cache;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control no-cache;
    }
    location = /offline_sw.js {
        add_header Cache-Control no-cache;
    }
    location = /manifest.json {
        add_header Cache-Control no-cache;
    }
    location = /version.json {
        add_header Cache-Control no-cache;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control no-cache;
    }
    location ~ ^/assets/(AssetManifest|FontManifest) {
        add_header Cache-Control no-cache;
    }

    # 同一次构建内不会变的引擎文件。
    location /canvaskit/ {
        expires 7d;
    }
    # 歌曲体积大、很少改动，缓存久一点，减少重复下载。
    location /assets/assets/audio/ {
        expires 7d;
    }
    # 图集/立绘文件名不带哈希，用短缓存，更新后最多 10 分钟生效。
    location /assets/assets/ {
        expires 10m;
    }
    # 本地回退字体分片。
    location /fonts/ {
        expires 1d;
    }
    location /icons/ {
        expires 1d;
    }

    # 不暴露 .git 等隐藏文件；上面的精确匹配仍优先生效（.last_build_id 可访问）。
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache;
    }
}
