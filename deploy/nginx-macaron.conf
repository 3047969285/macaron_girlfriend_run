# 马卡龙 Web 版 nginx 示例
# 放到 /etc/nginx/conf.d/macaron.conf（或宝塔的站点配置里），
# 把 root / server_name / 证书路径换成自己的，然后：
#   nginx -t && systemctl reload nginx
#
# 关键点：
# 1. gzip_static on：优先发送 build 时生成的 .gz，2.8MB 的 main.dart.js 只传约 0.8MB；
# 2. 静态资源长缓存：canvaskit / 图集 / 字体 / 音频；
# 3. index、bootstrap、service worker 不缓存，保证更新能生效；
# 4. HTTPS 才能启用 Service Worker 离线缓存，也能避免 HTTP 被中间网络劫持。

server {
    listen 80;
    server_name your-domain.example.com;  # 换成自己的域名；没有域名时先用下面的 HTTP 配置
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/macaron;  # build/web 的内容
    index index.html;

    charset utf-8;
    sendfile on;
    tcp_nopush on;

    # 动态 gzip 作为兜底；有 .gz 时 gzip_static 直接发预压缩文件。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    gzip_static on;
    # 如果 nginx 编了 brotli 模块，可以再开：
    # brotli_static on;

    # 不缓存的入口文件：保证新构建能被发现。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /offline_sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /.last_build_id {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # 同一次构建内不会变的资源，长缓存。
    location /canvaskit/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 如果暂时没有域名/证书，只想先解决“大文件慢”，可以只保留这个 80 端口配置，
# 并确认 gzip_static 生效；但 Service Worker 离线缓存必须 HTTPS。
