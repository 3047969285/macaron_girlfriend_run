<!DOCTYPE html>
<html>
<head>
  <base href="/macaron_girlfriend_run/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="马卡龙 · 甜蜜平台跳跃">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="马卡龙">
  <meta name="theme-color" content="#FFB4C8">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>马卡龙</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #FFF6F0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    flt-glass-pane { height: 100%; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, #FFB4C8 0%, #FFF6F0 55%, #B8F0D8 100%);
      color: #5C4033;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    #boot .candy { font-size: 48px; }
    #boot .title { font-size: 22px; font-weight: 800; }
    #boot .hint { font-size: 13px; opacity: 0.7; line-height: 1.5; }
    #boot.hidden { display: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="candy">🍬</div>
    <div class="title">马卡龙加载中…</div>
    <div class="hint">请横屏 · 首次加载大约需要几秒<br>若一直黑屏，请关掉蜂窝网络代理/VPN 后刷新</div>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var hide = function () {
        if (boot) boot.classList.add('hidden');
      };
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 12000);
      setTimeout(function () {
        if (!boot || boot.classList.contains('hidden')) return;
        boot.querySelector('.hint').textContent =
          '加载偏慢：请确认用 Safari 打开，并带末尾斜杠的完整链接刷新一次';
      }, 8000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
