<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="马卡龙 · 甜蜜平台跳跃">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="马卡龙">
  <meta name="theme-color" content="#FFB4C8">
  <script>
    // 手机普遍是 3x 屏：按 3 倍像素渲染 CanvasKit 会明显掉帧。
    // 低内存设备封顶 1.5x，其余封顶 2x，画面按 CSS 尺寸放大，FPS 更稳。
    (function () {
      var nativeDpr = window.devicePixelRatio || 1;
      var memory = navigator.deviceMemory || 4;
      var cap = memory <= 4 ? 1.5 : 2;
      if (nativeDpr <= cap) return;
      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return cap; },
        });
      } catch (e) {
        // 老浏览器不允许覆盖时保持原样。
      }
    })();
  </script>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>马卡龙</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #FFF6F0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    flt-glass-pane { height: 100%; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, #FFB4C8 0%, #FFF6F0 55%, #B8F0D8 100%);
      color: #5C4033;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    #boot .candy { font-size: 48px; }
    #boot .title { font-size: 22px; font-weight: 800; }
    #boot .hint { font-size: 13px; opacity: 0.7; line-height: 1.5; }
    #boot .retry {
      display: none;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: #FFFFFFCC;
      color: #5C4033;
      font: inherit;
      font-weight: 700;
    }
    #boot.slow .retry { display: inline-flex; }
    #boot.hidden { display: none; }
    #offline-status {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      max-width: min(340px, calc(100vw - 24px));
      padding: 8px 12px;
      border-radius: 10px;
      background: #ffffffed;
      color: #5C4033;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      box-shadow: 0 2px 10px #0002;
      z-index: 10000;
    }
  </style>
</head>
<body>
  <div id="offline-status" role="status" aria-live="polite" hidden></div>
  <div id="boot">
    <div class="candy">🍬</div>
    <div class="title">马卡龙加载中…</div>
    <div class="hint" role="status" aria-live="polite">正在加载游戏引擎，首次约需 10–30 秒</div>
    <button class="retry" type="button">重新加载</button>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var hint = boot.querySelector('.hint');
      var retry = boot.querySelector('.retry');
      var hide = function () {
        if (boot) boot.classList.add('hidden');
      };
      window.addEventListener('flutter-first-frame', hide, { once: true });
      retry.addEventListener('click', function () {
        window.location.reload();
      });
      setTimeout(function () {
        if (!boot || boot.classList.contains('hidden')) return;
        hint.textContent = '首次需下载约 10MB 引擎资源，之后会走缓存加速';
        boot.classList.add('slow');
      }, 20000);
      var bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
